[Mod]
Id = oOCamilleOo_FairDuelist
Name = Fair Duelist - Customizable Difficulty
Author = oOCamilleOo
Version = 1.5.1
AuthorURL = https://www.nexusmods.com/users/933214
Description = Absolute difficulty balance. Warning: confirming a difficulty in the game settings replaces custom values. Apply to save and update the active game.

[Setting.enabled]
Id = enabled
Label = Override difficulty balance
Group = General
Description = Enable editable balance values. Apply to save and update the active game.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.enemyHealthPercent]
Id = enemyHealthPercent
Label = Enemy health
Group = Balance
Description = Absolute percentage of the unscaled game value: 100% is normal, 50% is half, 150% is one and a half times. Adjusts in 5 percentage-point steps. Apply to save and update the active game.
Type = percent
Minimum = 0
Maximum = 500
Step = 5
Decimals = 1
Default = 90
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enemyHealthPercent

[Setting.enemyDamagePercent]
Id = enemyDamagePercent
Label = Enemy damage
Group = Balance
Description = Absolute percentage of the unscaled game value: 100% is normal, 50% is half, 150% is one and a half times. Adjusts in 5 percentage-point steps. Apply to save and update the active game.
Type = percent
Minimum = 0
Maximum = 500
Step = 5
Decimals = 1
Default = 160
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enemyDamagePercent

[Setting.staminaCostPercent]
Id = staminaCostPercent
Label = Combat stamina cost
Group = Balance
Description = Absolute percentage of the unscaled game value: 100% is normal, 50% is half, 150% is one and a half times. Adjusts in 5 percentage-point steps. Apply to save and update the active game.
Type = percent
Minimum = 0
Maximum = 500
Step = 5
Decimals = 1
Default = 175
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = staminaCostPercent

[Setting.attackDelayPercent]
Id = attackDelayPercent
Label = Enemy attack delay
Group = Balance
Description = Absolute attack-delay multiplier: 100% is the unscaled delay; lower values allow more frequent attacks. Does not change animation speed. Adjusts in 5 percentage-point steps. Apply to save and update the active game.
Type = percent
Minimum = 0
Maximum = 500
Step = 5
Decimals = 1
Default = 100
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = attackDelayPercent

[Setting.lowHealthAttackDelayPercent]
Id = lowHealthAttackDelayPercent
Label = Low-health enemy attack delay
Group = Balance
Description = Absolute attack-delay multiplier: 100% is the unscaled delay; lower values allow more frequent attacks. Does not change animation speed. Adjusts in 5 percentage-point steps. Apply to save and update the active game.
Type = percent
Minimum = 0
Maximum = 500
Step = 5
Decimals = 1
Default = 60
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = lowHealthAttackDelayPercent

[Setting.rangedAttackDelayPercent]
Id = rangedAttackDelayPercent
Label = Ranged enemy attack delay
Group = Balance
Description = Absolute attack-delay multiplier: 100% is the unscaled delay; lower values allow more frequent attacks. Does not change animation speed. Adjusts in 5 percentage-point steps. Apply to save and update the active game.
Type = percent
Minimum = 0
Maximum = 500
Step = 5
Decimals = 1
Default = 100
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = rangedAttackDelayPercent

[Setting.attackDuringBlock]
Id = attackDuringBlock
Label = Attacks while another enemy blocks
Group = Balance
Description = Allow an enemy to start an attack while another enemy is reacting to a block. Apply to save and update the active game.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = attackDuringBlock

[Setting.maxSimultaneousAttackers]
Id = maxSimultaneousAttackers
Label = Simultaneous attackers
Group = Balance
Description = Maximum enemies allowed to coordinate attacks against you. Limits 2–8 also allow attacks to overlap. Game default preserves the normal limit and overlap rule. Existing attacks finish when lowering the limit. Scripted attacks and attacks outside ticket coordination are not capped. Lower attack-delay settings for more frequent pressure. Apply to save and update the active game.
Type = picker
PresetValues = 0|1|2|3|4|5|6|7|8
PresetLabels = Game default|1|2|3|4|5|6|7|8
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = maxSimultaneousAttackers

[Setting.logLevel]
Id = logLevel
Label = Logging
Group = Diagnostics
Description = Cumulative diagnostic detail. Warning by default; Debug includes tracing and timings. Off silences all mod output.
Type = picker
PresetValues = 0|1|2|3|4
PresetLabels = Off|Error|Warning|Info|Debug
Default = 2
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = logLevel

[Category.Balance]
VisibleWhen = enabled
VisibleValues = 1
